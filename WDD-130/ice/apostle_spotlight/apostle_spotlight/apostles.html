<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        #mainsection{
            background-image: url("images/christus.webp");
            border-radius: 10%;
            max-width: 1500px;
        }
        body{
            color: #E8ECED;
            font-family: Arial, Helvetica, sans-serif;
        }
        #Presidency{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-content: center;
            justify-self: center;
            gap: 50px
            
        }
        #Twelve{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            max-width: 300px;
            max-height: 500px;
            gap: 25px;
            justify-content: center;
            justify-self: center;
            border-image: white;
            border-image-width: 10px;
        }
        h1{
            text-align: center;
        }
        h2{
            text-align: center;
        }
        img{
            border-radius: 50%;
            size: 200px;
            width: 200px;
            height: 200px;
        }
            
        
    </style>
</head>
<body>
    <div id="mainsection">
    <!-- Can't seem to figure out how to make them fit within the background image so just changed columns so they did fit -->
    
    <h1>
        First Presidency
    </h1>
    <div id="Presidency">
    <img class="Presidenct" src="images/eyring.webp">
    <img class="Presidenct" src="images/oaks.webp">
    <img class="Presidenct" src="images/christofferson.webp">
    </div>
    <h2>
        Quorum of the Twelve Apostles
    </h2>
    <div id="Twelve">
    <img class="Twelve" src="images/anderson.webp">
    <img class="Twelve" src="images/bednar.webp">
    <img class="Twelve" src="images/causse.webp">
    <img class="Twelve" src="images/cook.webp">
    <img class="Twelve" src="images/gilbert.webp">
    <img class="Twelve" src="images/gong.webp">
    <img class="Twelve" src="images/kearon.webp">
    <img class="Twelve" src="images/rasband.webp">
    <img class="Twelve" src="images/renlund.webp">
    <img class="Twelve" src="images/soares.webp">
    <img class="Twelve" src="images/stevenson.webp">
    <img class="Twelve" src="images/uchtdorf.webp">
    </div>
</div>    
</body>
</html>
